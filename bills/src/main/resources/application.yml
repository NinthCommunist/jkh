server:
  port: 8081
  servlet:
    context-path: /api/v1
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/jkh
    username: admin
    password: admin

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  liquibase:
