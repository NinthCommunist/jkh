server:
  port: 8081
  servlet:
    context-path: /api/v1
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/jkh
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml

  redis:
    host: localhost
    port: 6379


logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG
    org.springframework.data.redis: DEBUG
    io.lettuce.core: DEBUG
app.security.jwt:
  secret: 
  access:
    expiration: 30m
  refresh:
    expiration: 6h